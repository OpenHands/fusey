name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # MinIO stopped publishing images (the community repo is archived), so
      # the S3 integration tests run against RustFS instead.
      - name: Start RustFS
        run: |
          docker run -d --name rustfs \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=minio \
            -e RUSTFS_SECRET_KEY=miniominio \
            rustfs/rustfs:1.0.6
          # Wait up to 30 s for RustFS to become ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/health && break
            sleep 1
          done

      - name: go test
        env:
          FUSEY_TEST_ENDPOINT: http://localhost:9000
          FUSEY_ACCESS_KEY: minio
          FUSEY_SECRET_KEY: miniominio
        run: go test -race -count=1 -timeout 120s ./...
